name: SonarQube secrets scan

on:
  push:
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SonarQube CLI
        # Pinned to a full commit SHA of the SonarSource repository and run
        # from a saved file (no pipe-to-shell) so the executed artifact is
        # auditable and reproducible.
        run: |
          curl -fsSL https://raw.githubusercontent.com/SonarSource/sonarqube-cli/baec4e3d50af474dcae409eea01e4d8301061953/user-scripts/install.sh -o /tmp/sonarqube-install.sh
          bash /tmp/sonarqube-install.sh
      - name: Scan for secrets
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONARQUBE_CLI_ORG: psergio984
        run: |
          export PATH="$HOME/.local/share/sonarqube-cli/bin:$PATH"
          sonar analyze secrets .
